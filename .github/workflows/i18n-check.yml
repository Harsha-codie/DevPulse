name: i18n Completeness Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run i18n completeness check
        working-directory: ./frontend
        run: npm run check:i18n
      
      - name: Report status
        if: success()
        run: |
          echo "✅ i18n check passed successfully"
          echo "All translation keys are present and synchronized"
      
      - name: Report failure
        if: failure()
        run: |
          echo "❌ i18n check failed"
          echo "Please fix missing or unsynchronized translation keys"
          exit 1
